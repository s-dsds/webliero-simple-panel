var baseRoomName = 'simple';
var auth = new Map();
function chainFunction(object, attribute, func) {
  var original = object[attribute];
  if (original) {
    object[attribute] = function () {
      var or = original.apply(object, arguments);
      var r = func.apply(object, arguments);
      if (false == r || false == or) return false;
    };
  } else {
    object[attribute] = func;
  }
}
function writeLog() {} // command_log.js dependency — no-op

// capture RTDB writes. ROOT_SNAPSHOT, when set, is what statsRootRef.once('value')
// resolves to (for the statsUpdateNoIncrement fallback path, fix #4); child
// (players/<auth>) reads stay the default "no prior row" stub used everywhere else.
var CAPTURED = { updates: [], sets: [] };
var ROOT_SNAPSHOT = null;
var ROOT_PATH = baseRoomName + '/' + CONFIG.room_id + '/stats';
var HANG = false; // when true, .once('value') never resolves (seeded-hang scenario)
function fakeRef(path) {
  return {
    _p: path,
    child: function (c) { return fakeRef(path + '/' + c); },
    once: function () {
      if (HANG) return new Promise(function () {});
      if (path === ROOT_PATH && ROOT_SNAPSHOT) return Promise.resolve({ exists: function () { return true; }, val: function () { return ROOT_SNAPSHOT; } });
      return Promise.resolve({ exists: function () { return false; }, val: function () { return null; } });
    },
    set: function (v) { CAPTURED.sets.push({ path: path, v: v }); return Promise.resolve(); },
    update: function (o) { CAPTURED.updates.push({ path: path, o: o }); return Promise.resolve(); },
  };
}
var fdb = { ref: function (p) { return fakeRef(p); } };
var firebase = { database: { ServerValue: { increment: function (n) { return { __inc: n }; } } } };
var COLORS = { ERROR: 1, WARNING: 2, ANNOUNCE: 3, INFO: 4, PRIVATE: 5, NORMAL: 6, IMPORTANT: 7 };

// ---- stub WLROOM ----
var _players = [];   // {id, name, team, auth, score, kills, deaths}
var _settings = { gameMode: 'dm', scoreLimit: null, level: 'test.png' };
function setMode(mode, scoreLimit) { _settings = { gameMode: mode, scoreLimit: (scoreLimit != null ? scoreLimit : null), level: 'test.png' }; }
var WLROOM = {
  getPlayerList: function () { return _players.map(function (p) { return { id: p.id, name: p.name, team: p.team, auth: p.auth }; }); },
  getPlayerScore: function (id) { var p = _players.find(function (x) { return x.id === id; }); return p ? { score: p.score, kills: p.kills, deaths: p.deaths } : null; },
  getSettings: function () { return _settings; },
  sendAnnouncement: function () {},
};
window.WLROOM = WLROOM;
function setPlayers(list) { _players = list; list.forEach(function (p) { auth.set(p.id, p.auth); }); }

// capture console.log (for the @@GAME@@ emission + "stats: exit …" lines)
var LOGLINES = [];
var REAL_LOG = console.log.bind(console);
console.log = function () { LOGLINES.push(Array.prototype.slice.call(arguments).join(' ')); };
</script>

  assert('(m) statsGameStartTs===0 -> no afk flag in @@GAME@@ despite elapsed time', !(N1 && N1.afk));
  assert('(m) statsGameStartTs===0 -> no afkGames counter written', u['players/aN1/afkGames'] === undefined);

  // ===== (n) capability probe fed ONLY by onPlayerActivity — a kill must NOT prevent it tripping (fix #2) =====
  setMode('dm', null);
  setPlayers([
    { id: 61, name: 'P1', auth: 'aP1', team: 1, score: 0, kills: 0, deaths: 0 },
    { id: 62, name: 'P2', auth: 'aP2', team: 1, score: 0, kills: 0, deaths: 0 },
  ]);
  window.WLROOM.onGameStart(); await sleep(20);
  statsGameStartTs = Date.now() - 61000; // simulate a 61s-old game without a real 61s wait
  window.WLROOM.onPlayerKilled({ id: 61, name: 'P1' }, { id: 62, name: 'P2' }); // feeds statsAct, NOT statsRealActivityEvents
  var probeStillOkBeforeEnd = statsAfkSignalOk === true;
  window.WLROOM.onGameEnd();
  assert('(n) probe still armed right up to game end (a kill alone does not touch statsRealActivityEvents)', probeStillOkBeforeEnd);
  assert('(n) capability probe trips DESPITE the kill (old bug: statsAct.size masked it)', statsAfkSignalOk === false);
  statsAfkSignalOk = true; // restore — this flag is module-level and would poison every later test otherwise

  // ===== (o) statsUpdateNoIncrement fallback path for the rejoins counter (fix #4) =====
  statsHasIncrement = false;
  ROOT_SNAPSHOT = { players: { aO1: { rejoins: 5 } } };
  setMode('dm', null);
  setPlayers([
    { id: 71, name: 'O1', auth: 'aO1', team: 1, score: 0, kills: 0, deaths: 0 },
    { id: 72, name: 'O2', auth: 'aO2', team: 1, score: 0, kills: 0, deaths: 0 },
  ]);
  window.WLROOM.onGameStart(); await sleep(20);
  window.WLROOM.onPlayerTeamChange({ id: 71, name: 'O1', team: 0 });
  var orec = statsExits.get('aO1'); if (orec) orec.awayAt -= 6000;
  window.WLROOM.onPlayerTeamChange({ id: 71, name: 'O1', team: 1 });
  CAPTURED.updates = [];
  window.WLROOM.onGameEnd();
  await sleep(20); // statsUpdateNoIncrement is async: once('value').then(...).update(...)
  u = lastUpdate();
  assert('(o) no-increment fallback: rejoins READ-ADDED (5+1=6), not overwritten with 1', u['players/aO1/rejoins'] === 6);
  statsHasIncrement = true; ROOT_SNAPSHOT = null; // restore for later tests

  // ===== (p) midSession participant never abandons, even losing + material =====
  setMode('dm', null);
  setPlayers([
    { id: 81, name: 'P1', auth: 'aP1full', team: 1, score: 0, kills: 0, deaths: 0 },
  ]);
  window.WLROOM.onGameStart(); await sleep(20);
  _players.push({ id: 82, name: 'Q2', auth: 'aQ2mid', team: 1, score: 0, kills: 0, deaths: 0 }); auth.set(82, 'aQ2mid');
  window.WLROOM.onPlayerJoin({ id: 82, name: 'Q2', team: 1, auth: 'aQ2mid' }); // mid-session
  await sleep(5);
  _players[0].score = 5; _players[0].kills = 5; // the full participant pulls well ahead
  CAPTURED.updates = [];
  window.WLROOM.onPlayerLeave({ id: 82, name: 'Q2', team: 1 }); // Q2 (midSession) leaves while clearly losing
  window.WLROOM.onGameEnd();
  u = lastUpdate();
  assert('(p) midSession leaver -> exits+1', inc(u['players/aQ2mid/exits']) === 1);
  assert('(p) midSession leaver -> abandons+0 even though losing+material (never "full")', u['players/aQ2mid/abandons'] === undefined);

  // ===== statsIsCounterPath sanity (trap check) =====
  assert('statsIsCounterPath: rejoins is a counter', statsIsCounterPath('players/x/rejoins') === true);
  assert('statsIsCounterPath: cleanStreak is NOT a counter (absolute, §5 trap)', statsIsCounterPath('players/x/cleanStreak') === false);

  document.getElementById('out').textContent = out.join('\n') +
    '\n\n' + out.filter(function (x) { return x.indexOf('PASS') === 0; }).length + ' PASS / ' +
    out.filter(function (x) { return x.indexOf('FAIL') === 0; }).length + ' FAIL';
  document.title = out.filter(function (x) { return x.indexOf('FAIL') === 0; }).length === 0 ?
    'ALL PASS (' + out.length + ')' : 'FAILURES: ' + out.filter(function (x) { return x.indexOf('FAIL') === 0; }).join(' ; ');
})().catch(function (e) { document.getElementById('out').textContent = out.join('\n') + '\nTHREW: ' + (e && e.stack || e); document.title = 'THREW'; });
</script></body></html>
